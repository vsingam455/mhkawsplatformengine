name: Bug
description: Something is broken or behaves incorrectly
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behaviour versus expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dev
        - qa
        - prod
        - local
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, links
